<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Parliament Nigeria - ID Card Generator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Application Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="image/image-1.png" alt="Students Parliament Logo" class="header-logo">
        <div class="header-titles">
          <h1>Students Parliament Nigeria</h1>
          <p>Official ID Card Generator - Front & Back</p>
        </div>
      </div>
      <div>
        <button type="button" id="btnResetAll" class="btn-header-reset" title="Clear all input fields">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Reset Form
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="main-wrapper">
    <div class="layout-grid">

      <!-- ================================================================
           FORM INPUTS PANEL (LEFT)
           ================================================================ -->
      <section class="form-panel">
        <h2 class="panel-title">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          Card Information
        </h2>

        <form id="cardForm" autocomplete="off" onsubmit="return false;">
          <div class="form-grid">

            <!-- Full Name -->
            <div class="form-group full-width">
              <label for="inputName" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                  Bearer Full Name
                </span>
                <span style="color: #94a3b8; font-weight: normal; font-size: 0.75rem;">UPPERCASE</span>
              </label>
              <input type="text" id="inputName" class="form-input" placeholder="e.g. ADEOLA SEMILORE RODI" value="">
            </div>

            <!-- School / Branch -->
            <div class="form-group full-width">
              <label for="inputSchool" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 8.47L4.5 8.18 12 4.09l7.5 4.09L12 11.47zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                  School / Chapter / Branch
                </span>
              </label>
              <input type="text" id="inputSchool" class="form-input" placeholder="e.g. CSGS. GBERIGBE" value="">
            </div>

            <!-- ID Number with Auto-generate -->
            <div class="form-group">
              <label for="inputId" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"/></svg>
                  ID Number
                </span>
              </label>
              <div class="input-with-action">
                <input type="text" id="inputId" class="form-input" placeholder="e.g. SPA/ID/STU/26/061" value="">
                <button type="button" id="btnGenId" class="btn-inline-action" title="Generate random ID number">
                  <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                  Auto ID
                </button>
              </div>
            </div>

            <!-- Category -->
            <div class="form-group">
              <label for="inputCategory" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
                  Category / Role
                </span>
              </label>
              <select id="inputCategory" class="form-select">
                <option value="" disabled selected>Select Category</option>
                <option value="STUDENT">STUDENT</option>
                <option value="EXECUTIVE">EXECUTIVE</option>
                <option value="MEMBER">MEMBER</option>
                <option value="OFFICIAL">OFFICIAL</option>
                <option value="HONORARY">HONORARY</option>
              </select>
            </div>

            <!-- Date Issued -->
            <div class="form-group">
              <label for="inputDateIssued" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                  Date Issued
                </span>
              </label>
              <input type="text" id="inputDateIssued" class="form-input" placeholder="DD/MM/YYYY" value="">
            </div>

            <!-- Valid Until -->
            <div class="form-group">
              <label for="inputValidUntil" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zm-7-2l5-5-1.41-1.41L12 14.17l-1.59-1.59L9 14l3 3z"/></svg>
                  Valid Until
                </span>
              </label>
              <input type="text" id="inputValidUntil" class="form-input" placeholder="DD/MM/YYYY" value="">
            </div>

            <!-- Membership Status -->
            <div class="form-group full-width">
              <label for="inputStatus" class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                  Status
                </span>
              </label>
              <select id="inputStatus" class="form-select">
                <option value="ACTIVE" selected>ACTIVE</option>
                <option value="PENDING">PENDING</option>
                <option value="EXPIRED">EXPIRED</option>
              </select>
            </div>

            <!-- Passport Photograph Upload -->
            <div class="form-group full-width">
              <label class="form-label">
                <span class="label-with-icon">
                  <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                  Passport Photograph
                </span>
                <span style="color: #64748b; font-size: 0.75rem;">Top-right white box</span>
              </label>
              
              <!-- Clean, Full, Unclipped Upload Dropzone -->
              <div class="upload-dropzone" id="dropzone">
                <input type="file" id="passportFile" accept="image/*" style="display: none;">
                <div class="dropzone-inner">
                  <!-- Complete, Beautiful Vector Upload Icon -->
                  <svg class="dropzone-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  <p class="dropzone-text">Click or drag & drop passport image</p>
                  <p class="dropzone-hint">JPG, PNG, WEBP (Instantly overlays in passport box)</p>
                </div>
              </div>

              <!-- Photo Zoom, Position Controls & Reset Button -->
              <div class="photo-adjust-box" id="photoAdjustBox">
                <div class="photo-adjust-header">
                  <span class="photo-adjust-title">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    Photo Framing Adjustments
                  </span>
                  <button type="button" id="btnResetPhoto" class="btn-reset-photo" title="Reset Zoom and Positions to center">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset Framing
                  </button>
                </div>

                <div class="photo-sliders-row">
                  <div class="photo-adjust-group">
                    <label for="photoScaleRange">Zoom: <span id="scaleLabel">100%</span></label>
                    <input type="range" id="photoScaleRange" min="50" max="250" value="100">
                  </div>
                  <div class="photo-adjust-group">
                    <label for="photoPanXRange">Horizontal Position</label>
                    <input type="range" id="photoPanXRange" min="-100" max="100" value="0">
                  </div>
                  <div class="photo-adjust-group">
                    <label for="photoPanYRange">Vertical Position</label>
                    <input type="range" id="photoPanYRange" min="-100" max="100" value="0">
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- Bottom Action Buttons -->
          <div class="form-actions">
            <button type="button" id="btnDownloadFront" class="btn-primary-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Download Front (PNG)
            </button>
            <button type="button" id="btnDownloadBack" class="btn-secondary-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Download Back (PNG)
            </button>
            <button type="button" id="btnDownloadBothPDF" class="btn-gold-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
              Download PDF (Both)
            </button>
            <button type="button" id="btnPrintCard" class="btn-secondary-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
              Print Cards
            </button>
          </div>
        </form>
      </section>


      <!-- ================================================================
           REAL-TIME PREVIEW PANEL (RIGHT - FRONT & BACK)
           ================================================================ -->
      <section class="preview-panel">
        
        <div class="preview-badge-header">
          <div class="preview-badge-title">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            Live Preview (Front & Back)
          </div>

          <!-- View Toggles: Both, Front, Back -->
          <div class="view-tabs">
            <button type="button" class="tab-btn active" id="tabBoth">Both Sides</button>
            <button type="button" class="tab-btn" id="tabFront">Front</button>
            <button type="button" class="tab-btn" id="tabBack">Back</button>
          </div>
        </div>

        <!-- Cards Display Wrapper -->
        <div class="cards-preview-grid" id="cardsGrid">

          <!-- ============================================================
               FRONT CARD STAGE
               ============================================================ -->
          <div class="card-column" id="colFront">
            <span class="card-side-tag">Front Side</span>
            <div class="card-preview-container">
              <div class="card-stage" id="cardStageFront">
                <!-- Authentic High-Resolution Blank Front Template -->
                <img src="image/id-card front.png" alt="ID Card Front" class="card-bg-template">

                <!-- Real-Time Overlays Layer -->
                <div class="card-overlay-layer">
                  <!-- 1. Top-Right White Space: Passport Photo -->
                  <div class="overlay-passport-box" id="passportBox">
                    <div class="passport-empty-hint" id="passportEmptyHint">
                      <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                      </svg>
                      <span>Passport</span>
                    </div>
                    <img id="passportImg" src="" alt="Passport" style="display: none;">
                  </div>

                  <!-- 2. Full Name directly beneath Passport Box -->
                  <div class="overlay-bearer-name" id="viewName"></div>

                  <!-- 3. School / Branch directly beneath Name -->
                  <div class="overlay-bearer-school" id="viewSchool"></div>

                  <!-- 4. Left Side: ID NUMBER -->
                  <div class="overlay-data-val overlay-id-number" id="viewId"></div>

                  <!-- 5. Left Side: CATEGORY -->
                  <div class="overlay-data-val overlay-category" id="viewCategory"></div>

                  <!-- 6. Left Side: DATE ISSUED -->
                  <div class="overlay-data-val overlay-date-issued" id="viewDateIssued"></div>

                  <!-- 7. Left Side: VALID UNTIL -->
                  <div class="overlay-data-val overlay-valid-until" id="viewValidUntil"></div>

                  <!-- 8. Left Side: STATUS BADGE -->
                  <div class="overlay-status-row" id="viewStatusRow">
                    <span class="overlay-status-badge" id="viewStatusBadge">ACTIVE</span>
                  </div>

                  <!-- 9. Lower-Right White Space: Dynamic QR Code -->
                  <div class="overlay-qr-box" id="qrBox">
                    <div class="qr-empty-hint" id="qrEmptyHint">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 2h2v3h-2v-3zm2 3h2v3h-2v-3zm3-1h3v2h-3v-2zm0 3h3v2h-3v-2zm-5 0h2v2h-2v-2z"/>
                      </svg>
                      <span>QR CODE</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ============================================================
               BACK CARD STAGE
               ============================================================ -->
          <div class="card-column" id="colBack">
            <span class="card-side-tag">Back Side</span>
            <div class="card-preview-container">
              <div class="card-stage" id="cardStageBack">
                <!-- Authentic High-Resolution Official Back Template -->
                <img src="image/id-card back.png" alt="ID Card Back" class="card-bg-template">
              </div>
            </div>
          </div>

        </div>

      </section>

    </div>
  </main>

  <!-- Notification Toast -->
  <div class="toast-notice" id="toastNotice">Card Updated</div>

  <!-- Vendor Libraries -->
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
