<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Parliament Nigeria — Front ID Card Generator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Application Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="image/image-1.png" alt="Students Parliament Logo" class="header-logo">
        <div class="header-titles">
          <h1>Students Parliament Nigeria</h1>
          <p>Official ID Card Generator — Front Side</p>
        </div>
      </div>
      <div>
        <button type="button" id="btnResetAll" class="btn-header-reset" title="Clear all input fields">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Reset Form
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="main-wrapper">
    <div class="layout-grid">

      <!-- ================================================================
           FORM INPUTS PANEL (LEFT)
           ================================================================ -->
      <section class="form-panel">
        <h2 class="panel-title">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          Card Information
        </h2>

        <form id="cardForm" autocomplete="off" onsubmit="return false;">
          <div class="form-grid">

            <!-- Full Name -->
            <div class="form-group full-width">
              <label for="inputName" class="form-label">
                <span>Bearer Full Name</span>
                <span style="color: #94a3b8; font-weight: normal; font-size: 0.75rem;">UPPERCASE</span>
              </label>
              <input type="text" id="inputName" class="form-input" placeholder="e.g. ADEOLA SEMILORE RODI" value="">
            </div>

            <!-- School / Branch -->
            <div class="form-group full-width">
              <label for="inputSchool" class="form-label">School / Chapter / Branch</label>
              <input type="text" id="inputSchool" class="form-input" placeholder="e.g. CSGS. GBERIGBE" value="">
            </div>

            <!-- ID Number with Auto-generate -->
            <div class="form-group">
              <label for="inputId" class="form-label">ID Number</label>
              <div class="input-with-action">
                <input type="text" id="inputId" class="form-input" placeholder="e.g. SPA/ID/STU/26/061" value="">
                <button type="button" id="btnGenId" class="btn-inline-action" title="Generate random ID number">Auto ID</button>
              </div>
            </div>

            <!-- Category -->
            <div class="form-group">
              <label for="inputCategory" class="form-label">Category / Role</label>
              <select id="inputCategory" class="form-select">
                <option value="" disabled selected>Select Category</option>
                <option value="STUDENT">STUDENT</option>
                <option value="EXECUTIVE">EXECUTIVE</option>
                <option value="MEMBER">MEMBER</option>
                <option value="OFFICIAL">OFFICIAL</option>
                <option value="HONORARY">HONORARY</option>
              </select>
            </div>

            <!-- Date Issued -->
            <div class="form-group">
              <label for="inputDateIssued" class="form-label">Date Issued</label>
              <input type="text" id="inputDateIssued" class="form-input" placeholder="DD/MM/YYYY" value="">
            </div>

            <!-- Valid Until -->
            <div class="form-group">
              <label for="inputValidUntil" class="form-label">Valid Until</label>
              <input type="text" id="inputValidUntil" class="form-input" placeholder="DD/MM/YYYY" value="">
            </div>

            <!-- Membership Status -->
            <div class="form-group full-width">
              <label for="inputStatus" class="form-label">Status</label>
              <select id="inputStatus" class="form-select">
                <option value="ACTIVE" selected>ACTIVE</option>
                <option value="PENDING">PENDING</option>
                <option value="EXPIRED">EXPIRED</option>
              </select>
            </div>

            <!-- Passport Photograph Upload -->
            <div class="form-group full-width">
              <label class="form-label">
                <span>Passport Photograph</span>
                <span style="color: #64748b; font-size: 0.75rem;">Top-right white box</span>
              </label>
              
              <div class="upload-dropzone" id="dropzone">
                <input type="file" id="passportFile" accept="image/*" style="display: none;">
                <div class="dropzone-inner">
                  <svg class="dropzone-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                  </svg>
                  <p class="dropzone-text">Click or drag & drop passport image</p>
                  <p class="dropzone-hint">JPG, PNG, WEBP (Instantly overlays in passport box)</p>
                </div>
              </div>

              <!-- Photo Zoom & Pan Position Controls -->
              <div class="photo-adjust-box" id="photoAdjustBox">
                <div class="photo-adjust-group">
                  <label for="photoScaleRange">Zoom: <span id="scaleLabel">100%</span></label>
                  <input type="range" id="photoScaleRange" min="50" max="250" value="100">
                </div>
                <div class="photo-adjust-group">
                  <label for="photoPanYRange">Vertical Position</label>
                  <input type="range" id="photoPanYRange" min="-100" max="100" value="0">
                </div>
              </div>
            </div>

          </div>

          <!-- Bottom Action Buttons -->
          <div class="form-actions">
            <button type="button" id="btnDownloadFront" class="btn-primary-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Download Front Card (PNG)
            </button>
            <button type="button" id="btnPrintCard" class="btn-secondary-action">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
              Print Card
            </button>
          </div>
        </form>
      </section>


      <!-- ================================================================
           REAL-TIME PREVIEW OVERLAY PANEL (RIGHT)
           ================================================================ -->
      <section class="preview-panel">
        
        <div class="preview-badge-header">
          <div class="preview-badge-title">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            Live Front Preview
          </div>
          <div class="live-indicator">
            <span class="live-dot"></span>
            Real-Time
          </div>
        </div>

        <div class="card-preview-container">
          <!-- The Exact Card Stage -->
          <div class="card-stage" id="cardStage">
            
            <!-- Authentic High-Resolution Blank Template Image -->
            <img src="image/id-card front.png" alt="ID Card Front Template" class="card-bg-template">

            <!-- Real-Time Overlays Layer -->
            <div class="card-overlay-layer">

              <!-- 1. Top-Right White Space: Passport Photo -->
              <div class="overlay-passport-box" id="passportBox">
                <div class="passport-empty-hint" id="passportEmptyHint">
                  <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                  </svg>
                  <span>Passport</span>
                </div>
                <img id="passportImg" src="" alt="Passport" style="display: none;">
              </div>

              <!-- 2. Full Name directly beneath Passport Box -->
              <div class="overlay-bearer-name" id="viewName"></div>

              <!-- 3. School / Branch directly beneath Name -->
              <div class="overlay-bearer-school" id="viewSchool"></div>

              <!-- 4. Left Side: ID NUMBER -->
              <div class="overlay-data-val overlay-id-number" id="viewId"></div>

              <!-- 5. Left Side: CATEGORY -->
              <div class="overlay-data-val overlay-category" id="viewCategory"></div>

              <!-- 6. Left Side: DATE ISSUED -->
              <div class="overlay-data-val overlay-date-issued" id="viewDateIssued"></div>

              <!-- 7. Left Side: VALID UNTIL -->
              <div class="overlay-data-val overlay-valid-until" id="viewValidUntil"></div>

              <!-- 8. Left Side: STATUS BADGE -->
              <div class="overlay-status-row" id="viewStatusRow">
                <span class="overlay-status-badge" id="viewStatusBadge">ACTIVE</span>
              </div>

              <!-- 9. Lower-Right White Space: Dynamic QR Code -->
              <div class="overlay-qr-box" id="qrBox">
                <div class="qr-empty-hint" id="qrEmptyHint">QR CODE</div>
              </div>

            </div>

          </div>
        </div>

      </section>

    </div>
  </main>

  <!-- Notification Toast -->
  <div class="toast-notice" id="toastNotice">Card Updated</div>

  <!-- Vendor Libraries -->
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
